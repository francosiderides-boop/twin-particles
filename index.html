<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Twin Particles">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;overscroll-behavior-y:none}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Twin Particles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500&family=Kalam:wght@400&family=Homemade+Apple&family=Shadows+Into+Light&family=Indie+Flower&family=Dancing+Script:wght@500&family=Reenie+Beanie&family=Patrick+Hand&display=swap">
<style>
/* Layout: una columna de teléfono; dos partículas como corazón visual; inicio de vinculación a pantalla completa; barra de pestañas inferior. */
:root{
  --bg:#f3f1f8; --surface:#ffffff; --surface2:#e9e5f3; --fg:#221d33; --muted:#6c6582; --line:#dcd6ea;
  --a:#8a6fd6; --b:#e0779b; --ok:#2f8f6a; --warn:#c0603f;
  --f-display:"Sora", "Avenir Next", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0d1a; --surface:#151829; --surface2:#1d2136; --fg:#eceaf6; --muted:#9a98b4; --line:#2a2e48;
  --a:#ff8fa3; --b:#8fd3ff; --ok:#6fd6a8; --warn:#ffb08a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d1a; --surface:#151829; --surface2:#1d2136; --fg:#eceaf6; --muted:#9a98b4; --line:#2a2e48;
  --a:#ff8fa3; --b:#8fd3ff; --ok:#6fd6a8; --warn:#ffb08a; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:10px}
p{margin:0}

/* tipografía */
.label{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.005em;color:var(--muted);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.025em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.12}
h2{font-size:22px;line-height:1.2}
h3{font-size:15px;font-weight:700;margin:0}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lead{color:var(--muted);font-size:15px;max-width:34ch}

/* marca */
.iso{display:block;flex:none}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg)}
.wm{font-family:var(--f-display);font-size:22px;letter-spacing:-.035em;line-height:1;white-space:nowrap}
.wm b{font-weight:600}.wm span{font-weight:300}

/* contenedores */
.app{max-width:460px;margin:0 auto;padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 12px}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;opacity:.35;transition:opacity .3s}
.dot.on{opacity:1}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.view{animation:fadeIn .28s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.section:first-child{margin-top:4px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.linkbtn{color:var(--muted);font-size:13px;font-weight:600}

/* partículas */
.pair{position:relative;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.pair canvas{display:block;width:100%;height:200px}
.who{position:absolute;bottom:14px;display:flex;flex-direction:column;gap:3px}
.who.l{left:18px}.who.r{right:18px;text-align:right}
.who b{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:-.02em;line-height:1}
.state{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px}

/* controles */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;transition:transform .15s var(--ease),background .15s,color .15s}
.chip:active{transform:scale(.95)}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.sent{background:var(--a);color:var(--bg);border-color:var(--a)}
.row{display:flex;gap:8px}
.input{flex:1;min-width:0;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s}
.input:focus{outline:none;border-color:var(--a)}
.input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:700;white-space:nowrap;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.soft{background:var(--surface2);color:var(--fg)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn.full{width:100%}
.btn.lg{padding:16px 18px;font-size:16px;border-radius:14px}
.err{color:var(--warn);font-size:13px;font-weight:600;min-height:1.2em}

/* historial */
.feed{display:flex;flex-direction:column}
.msg{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.msg:last-child{border-bottom:0}
.msg .sp{width:8px;height:8px;border-radius:50%;flex:none}
.msg .tx{min-width:0;overflow-wrap:anywhere}
.msg .t{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

/* despertador */
.alarm{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r);background:var(--surface2)}
.hold{position:relative;overflow:hidden;width:100%;padding:16px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:700;user-select:none;-webkit-user-select:none;touch-action:none}
.hold .fill{position:absolute;inset:0;background:var(--warn);transform-origin:left;transform:scaleX(0)}
.hold span{position:relative}
.ringing{display:flex;align-items:center;gap:12px}
.bell{width:40px;height:40px;border-radius:50%;background:var(--warn);display:grid;place-items:center;color:var(--bg);flex:none}
.bell svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}
.ringing.live .bell{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}

/* álbumes */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.album{display:flex;flex-direction:column;gap:4px;text-align:left}
.cover{aspect-ratio:1;max-width:100%;border-radius:var(--r);background:var(--surface2);background-size:cover;background-position:center;position:relative;overflow:hidden;margin-bottom:4px}
.cover .n{position:absolute;right:8px;bottom:8px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(0,0,0,.5);color:#fff}
.newcover{display:grid;place-items:center;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ph{aspect-ratio:1;max-width:100%;background-size:cover;background-position:center;border-radius:8px;background-color:var(--surface2)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-weight:600;padding:6px 0}
.back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* listas */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.tabs::-webkit-scrollbar{display:none}
.tabs .chip{white-space:nowrap;flex:none}
.count{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-left:4px}
.items{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.check{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;transition:background .15s}
.check svg{width:14px;height:14px;stroke:var(--bg);stroke-width:3;fill:none;opacity:0}
.item.done .check{background:var(--ok);border-color:var(--ok)}
.item.done .check svg{opacity:1}
.item.done .it{text-decoration:line-through;color:var(--muted)}
.itxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.it{font-weight:600;overflow-wrap:anywhere}
.sub a{color:var(--a);font-weight:600}
.x{color:var(--muted);width:32px;height:32px;display:grid;place-items:center;flex:none;border-radius:50%}
.x svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}

/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calhead h2{text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.day{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.day.today{box-shadow:inset 0 0 0 1.5px var(--fg)}
.day.sel{background:var(--fg);color:var(--bg)}
.day .ds{display:flex;gap:3px;height:5px}
.day .ds i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:center;padding:12px 8px 12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ev .tm{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:46px;font-variant-numeric:tabular-nums}
.ev .bar{width:3px;align-self:stretch;border-radius:2px;flex:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.note{font-size:13px;color:var(--muted);padding:12px 14px;border-radius:12px;background:var(--surface2)}
.note b{color:var(--fg)}

/* cartas */
.letters{display:flex;flex-direction:column;gap:10px}
.env{display:flex;gap:14px;align-items:center;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.env .seal{width:52px;height:38px;flex:none;position:relative;border-radius:5px;background:var(--surface2);overflow:hidden}
.env .seal:before{content:"";position:absolute;left:0;top:0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:21px solid var(--line)}
.env .seal:after{content:"";position:absolute;left:50%;top:14px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--a)}
.env.opened .seal:after{background:var(--muted);opacity:.35}
.env .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:0;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;flex:none}
.tag.new{background:var(--a);color:var(--bg)}
.paper{border-radius:8px;width:100%;display:block}
.player{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface2)}
.play{width:46px;height:46px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.play svg{width:18px;height:18px;fill:currentColor}
.prog{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--a)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface2)}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted);transition:background .15s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* barra de pestañas */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:600;position:relative}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--fg)}
.tb.on svg{stroke:var(--a)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--a);color:var(--bg);font-size:10px;font-weight:700;display:grid;place-items:center}

/* hoja inferior */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,6,15,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .3s var(--ease)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 2px;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:8px 2px;border-radius:14px;border:1.5px solid transparent}
.sw.on{border-color:var(--fg)}
.sw .orb{width:44px;height:44px;border-radius:50%;position:relative;border:1px solid var(--line)}
.sw .orb i{position:absolute;width:11px;height:11px;border-radius:50%;top:16px}
.sw .orb i:first-child{left:8px}.sw .orb i:last-child{right:8px}
.group{display:flex;flex-direction:column;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.group>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.group>div:last-child{border-bottom:0}
.changelog{display:flex;flex-direction:column;gap:12px}
.changelog ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.ver{text-align:center;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--muted)}

/* push + toast */
.push{position:fixed;z-index:60;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-170%);width:min(440px,calc(100% - 24px));
  display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18);transition:transform .4s cubic-bezier(.2,.9,.3,1.15)}
.push.show{transform:translate(-50%,0)}
.appicon{width:36px;height:36px;border-radius:10px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.push .pt{display:flex;justify-content:space-between;gap:8px}
.push>div{min-width:0;flex:1}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);display:flex;align-items:center;gap:14px;padding:11px 18px;border-radius:99px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s var(--ease);pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--a);font-weight:700}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px;animation:fade .2s}
.lightbox img{max-height:85%;border-radius:10px}

/* inicio / vinculación */
.ob{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:18px 14px}
.ob-top{display:flex;justify-content:center;padding-block:8px 0;transition:opacity .5s}
.ob-stage{position:relative;flex:1;min-height:220px;display:flex;flex-direction:column}
.ob-stage canvas{flex:1;width:100%;min-height:220px;display:block}
.ob-names{display:flex;justify-content:space-between;padding-inline:8%;margin-top:-6px;transition:opacity .4s}
.ob-names div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:70px}
.ob-names b{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:16px}
.ob-names b.unk{color:var(--muted)!important;font-weight:300}
.pcolors{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:16px;font-size:12px;font-weight:600;color:var(--muted);border:1.5px solid transparent;transition:transform .25s var(--spring),border-color .2s,color .2s}
.pc i{width:30px;height:30px;border-radius:50%;background:var(--c);box-shadow:0 0 0 0 var(--c),0 0 18px color-mix(in srgb,var(--c) 55%,transparent);transition:box-shadow .3s,transform .3s var(--spring)}
.pc.on{border-color:var(--hi2);background:var(--glass-bg);color:var(--fg)}
.pc.on i{transform:scale(1.12);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c),0 0 26px var(--c)}
.pc:active{transform:scale(.92)}
.ob-panel{display:flex;flex-direction:column;gap:14px;padding-top:20px;animation:fadeIn .35s var(--ease)}
.ob-foot{padding-top:16px}
.code{font-family:var(--f-display);font-size:30px;letter-spacing:.12em;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:18px 10px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
input.code{font-size:24px;text-transform:uppercase;padding:14px 10px}
input.code::placeholder{color:var(--line)}
.waiting{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--a);animation:rot .9s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .3s var(--ease),background .3s}
.steps i.on{width:20px;background:var(--fg)}
.bonded-msg{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;animation:fadeIn .6s var(--ease)}

/* listas con portada */
.lcards{display:flex;flex-direction:column;gap:10px}
.lc{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:transform .15s var(--ease)}
.lc:active{transform:scale(.99)}
.lc.done .th,.lc.done .itxt{opacity:.55}
.lc.done .it{text-decoration:line-through}
.lc.done .check{background:var(--ok);border-color:var(--ok)}
.lc.done .check svg{opacity:1}
.lc .check{align-self:center}
.lc .itxt{gap:3px;padding-top:2px}
.th{flex:none;border-radius:10px;background-color:var(--surface2);background-size:cover;background-position:center;position:relative;overflow:hidden}
.th-place,.th-square{width:76px;height:76px}
.th-poster{width:60px;height:90px;border-radius:7px}
.th-video{width:116px;height:66px}
.playb{position:absolute;inset:0;margin:auto;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.playb svg{width:12px;height:12px;fill:#fff;margin-left:2px}
.playb.lg{width:56px;height:56px}.playb.lg svg{width:22px;height:22px}
.dur{position:absolute;right:4px;bottom:4px;font-family:var(--f-mono);font-size:10px;background:rgba(0,0,0,.72);color:#fff;padding:1px 5px;border-radius:4px}
.desc{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.by{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:2px}
.src{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:0;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--fg)}
.hero{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:16px;background-color:var(--surface2);background-size:cover;background-position:center;flex:none}
.hero.poster{width:170px;aspect-ratio:2/3;margin:0 auto;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hero.square{width:200px;aspect-ratio:1;margin:0 auto}
input.input[type=date],input.input[type=time],select.input{-webkit-appearance:none;appearance:none;min-height:48px;line-height:1.2;text-align:left;font:inherit;color:var(--ink,inherit)}
select.input{text-align-last:center;font-size:18px;font-variant-numeric:tabular-nums}
input.input::-webkit-date-and-time-value{text-align:left}
textarea.input{resize:vertical;min-height:76px;line-height:1.45}
a.btn{text-decoration:none}

/* buzón */
.mb-scene{position:relative;height:330px;border-radius:24px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.mb-ground{position:absolute;left:0;right:0;bottom:0;height:62px;background:var(--surface2);border-top:1px solid var(--line)}
.mb{position:absolute;left:50%;bottom:48px;width:200px;height:256px;margin-left:-100px;cursor:pointer;outline:none}
.mb:focus-visible .mb-door{outline:2px solid var(--fg);outline-offset:4px}
.mb-post{position:absolute;left:50%;bottom:0;width:22px;height:108px;margin-left:-11px;border-radius:4px 4px 2px 2px;background:var(--muted);opacity:.55}
.mb-box{position:absolute;left:0;right:0;bottom:100px;height:156px;border-radius:100px 100px 14px 14px;background:color-mix(in srgb,var(--a) 62%,var(--fg));perspective:700px}
.mb-inside{position:absolute;inset:10px 10px 8px;border-radius:90px 90px 8px 8px;background:color-mix(in srgb,var(--a) 22%,#0a0912);overflow:hidden;box-shadow:inset 0 14px 24px rgba(0,0,0,.5)}
.mb-door{position:absolute;inset:0;border-radius:100px 100px 14px 14px;background:var(--a);transform-origin:50% 100%;transition:transform .8s cubic-bezier(.34,1.35,.5,1),filter .8s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--bg);box-shadow:inset 0 -7px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.2)}
.mb.open .mb-door{transform:rotateX(-104deg);filter:brightness(.65)}
.mb-door>*{transition:opacity .3s}
.mb.open .mb-door>*{opacity:0}
.mb-iso{opacity:.9;margin-top:10px}
.mb-handle{width:44px;height:8px;border-radius:4px;background:var(--bg);opacity:.75}
.mb-flag{position:absolute;right:-18px;top:44px;width:7px;height:78px;border-radius:3px;background:var(--muted);transform-origin:50% 100%;transform:rotate(90deg);transition:transform .7s cubic-bezier(.34,1.6,.5,1) .1s;z-index:2}
.mb-flag i{position:absolute;top:0;left:7px;width:28px;height:19px;border-radius:1px 4px 4px 1px;background:var(--warn);transform-origin:left center}
.mb.has .mb-flag{transform:rotate(0)}
.mb.open .mb-flag{transform:rotate(90deg)}
.mb.has:not(.open) .mb-flag i{animation:wave 2.6s ease-in-out infinite}
@keyframes wave{0%,78%,100%{transform:skewY(0)}86%{transform:skewY(-10deg)}93%{transform:skewY(7deg)}}
.mb-env{position:absolute;bottom:6px;width:72px;height:50px;border-radius:5px;background:#f6f1e7;transform:translateY(54px) rotate(var(--r));transition:transform .2s ease-in;box-shadow:0 6px 14px rgba(0,0,0,.4);overflow:hidden}
.mb-env:before{content:"";position:absolute;left:0;top:0;border-left:36px solid transparent;border-right:36px solid transparent;border-top:27px solid #e4dccb}
.mb-env:after{content:"";position:absolute;left:50%;top:20px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#b9ad96}
.mb-env.new:after{background:var(--b);box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 30%,transparent)}
.mb-env.lock:after{width:10px;height:12px;border-radius:2px;margin-left:-5px;background:#8f8572}
.mb.open .mb-env{transform:translateY(-16px) rotate(var(--r));transition:transform .6s cubic-bezier(.3,1.5,.5,1) calc(.35s + var(--i) * .12s)}
.mb.open .mb-env:hover{transform:translateY(-24px) rotate(var(--r))}
.mb-hint{position:absolute;left:12px;right:12px;bottom:20px;text-align:center;font-size:13px;color:var(--muted);font-weight:600;margin:0}

/* despertador */
.alarm-div{height:1px;background:var(--line);margin-block:2px}
.alarm .chips .chip{padding:8px 13px;font-size:13px}
#tones{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tones .chip{width:100%;padding:11px 10px;font-size:14px;text-align:center}
.alarm .btn.soft{background:var(--surface);border:1px solid var(--line);white-space:normal;min-width:0;text-align:center}
.alarm .row{flex-wrap:wrap}
.hold.heavy span{display:flex;flex-direction:column;gap:2px;align-items:center}
.hold.heavy small{font-size:12px;font-weight:600;opacity:.85}
.ring{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;justify-content:center;animation:fade .25s;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.ring:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--warn) 30%,transparent),transparent 62%);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35}}
.ring-in{position:relative;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:20px;text-align:center}
.ring-time{font-family:var(--f-display);font-weight:300;font-size:76px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.ring-orb{position:relative;width:180px;height:180px;display:grid;place-items:center;color:var(--fg)}
.ring-orb span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--warn);animation:ripple 1.8s ease-out infinite}
.ring-orb span+span{animation-delay:.9s}
.ring-orb .iso{animation:shake .5s infinite}
@keyframes ripple{from{transform:scale(.45);opacity:.9}to{transform:scale(1.25);opacity:0}}
.ring-actions{width:100%;display:flex;flex-direction:column;gap:10px}
.ring .hold{padding:20px;font-size:16px;border-radius:14px}
/* buscador */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:18px;height:18px;margin-top:-9px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search .input{padding-left:42px}
.results{display:flex;flex-direction:column;gap:6px;min-height:60px}
.res{display:flex;gap:12px;align-items:center;text-align:left;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.res .itxt{gap:3px}
.res .th-poster{width:44px;height:66px}.res .th-place,.res .th-square{width:56px;height:56px}.res .th-video{width:96px;height:54px}
/* interruptores */
.group label{flex:1}
.sw-t{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
.sw-t:before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw-t:checked{background:var(--ok)}
.sw-t:checked:before{transform:translateX(18px)}
/* sueño pesado */
.ign{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.ign i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.ign i.on{background:var(--warn)}
.ign span{margin-left:6px}
.alarm.heavy-ready{background:color-mix(in srgb,var(--warn) 16%,var(--surface2));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--warn) 55%,transparent)}
.heavy-head{display:flex;flex-direction:column;gap:4px}
.hold.heavy{background:var(--warn);color:#fff;padding:20px;font-size:16px}
.hold.heavy .fill{background:#7a1d10}
.ringing.hv .bell{background:#c62f1c;animation:shake .22s infinite}
.ringbar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ringbar i{display:block;height:100%;width:0;background:var(--warn)}
.ring.heavy{--warn:#ff3b24}
.ring.heavy:before{background:radial-gradient(circle at 50% 38%,rgba(255,59,36,.55),transparent 70%);animation:strobe .5s steps(2) infinite}
@keyframes strobe{50%{opacity:.15}}
.ring.heavy .ring-orb .iso{animation:shake .18s infinite}
.ring.heavy .ring-orb span{animation-duration:1s}
.ring.heavy .ring-orb span:nth-child(2){animation-delay:.33s}.ring.heavy .ring-orb span:nth-child(3){animation-delay:.66s}
.ring.heavy .hold{background:#ff3b24;color:#fff}
.ring.heavy .hold .fill{background:#7a1d10}
.awake{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%}
.sum{font-family:var(--f-display);font-weight:600;font-size:44px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts .btn{font-size:22px;font-variant-numeric:tabular-nums}
/* papel y letra a mano */
.sheet-paper{position:relative;border-radius:6px;background-color:#fbf6ea;color:var(--ink);font-family:var(--hand);font-size:var(--hs);line-height:34px;
  background-image:linear-gradient(90deg,transparent 38px,rgba(214,92,92,.45) 38px,rgba(214,92,92,.45) 39.5px,transparent 39.5px),linear-gradient(transparent 33px,rgba(70,110,170,.28) 33px,rgba(70,110,170,.28) 34px);
  background-size:100% 100%,100% 34px;background-repeat:no-repeat,repeat;
  padding:34px 18px 26px 50px;box-shadow:0 1px 2px rgba(0,0,0,.1),0 10px 26px rgba(0,0,0,.14)}
.sheet-paper .pdate{position:absolute;top:0;right:18px;line-height:34px;font-size:.82em;opacity:.8}
.sheet-paper .ptext{white-space:pre-wrap;overflow-wrap:anywhere;min-height:204px}
.sheet-paper .psign{text-align:right;padding-right:6px}
.sheet-paper .psign:before{content:"— "}
.sheet-paper.edit textarea{display:block;width:100%;border:0;margin:0;padding:0;background:transparent;resize:none;overflow:hidden;color:var(--ink);font:inherit;line-height:34px;caret-color:var(--ink);outline:none;min-height:272px}
.sheet-paper.edit textarea::placeholder{color:var(--ink);opacity:.35}
.sheet-paper.edit:focus-within{box-shadow:0 0 0 2px var(--a),0 10px 26px rgba(0,0,0,.14)}
.paper-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hand{display:flex;flex-direction:column;gap:6px;text-align:left;padding:6px;border-radius:14px;border:1.5px solid transparent}
.hand.on{border-color:var(--fg)}
.paper-mini{display:block;border-radius:5px;background:#fbf6ea linear-gradient(transparent 29px,rgba(70,110,170,.28) 29px,rgba(70,110,170,.28) 30px) 0 0/100% 30px;color:var(--ink);font-family:var(--hand);font-size:calc(var(--hs) * .8);line-height:30px;padding:0 10px;min-height:90px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hand-n{font-size:13px;font-weight:600;padding-left:4px}
.inkdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:0}
.hand-prev{font-family:var(--hand);font-size:calc(var(--hs) * .85);color:var(--ink);background:#fbf6ea;padding:0 10px;border-radius:6px;line-height:30px}
/* tareas */
.tfilter{flex-wrap:wrap}
.tabs .chip.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tfilter .chip{padding:8px 13px;font-size:13px}
.tasks{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.task .itxt{cursor:pointer;gap:4px}
.task.done .check{background:var(--ok);border-color:var(--ok)}
.task.done .check svg{opacity:1}
.task.done .it{text-decoration:line-through;color:var(--muted)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.asg,.due{font-family:var(--f-body);font-size:11.5px;font-weight:600;letter-spacing:0;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--fg)}
.asg.w-m{box-shadow:inset 0 0 0 1px var(--a)}.asg.w-p{box-shadow:inset 0 0 0 1px var(--b)}
.due.today{background:var(--fg);color:var(--bg)}
.due.late{background:var(--warn);color:var(--bg)}
.nudge svg{stroke-width:1.7;width:18px;height:18px}
/* ===== liquid glass + movimiento (beta 0.6) ===== */
:root{--hi:rgba(255,255,255,.75);--hi2:rgba(255,255,255,.35);--glass-bg:color-mix(in srgb,var(--surface) 58%,transparent);--glass-strong:color-mix(in srgb,var(--surface) 72%,transparent);--glass-sh:0 10px 30px rgba(40,30,80,.10);--spring:cubic-bezier(.34,1.45,.5,1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hi:rgba(255,255,255,.14);--hi2:rgba(255,255,255,.06);--glass-sh:0 12px 34px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--hi:rgba(255,255,255,.14);--hi2:rgba(255,255,255,.06);--glass-sh:0 12px 34px rgba(0,0,0,.35)}

/* fondo ambiental: dos manchas de luz que derivan lento, para que el vidrio tenga algo que refractar */
#ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#ambient i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.22}
#ambient i:first-child{background:var(--a);left:-30vmax;top:-25vmax;animation:drift1 38s ease-in-out infinite alternate}
#ambient i:last-child{background:var(--b);right:-32vmax;bottom:-30vmax;animation:drift2 44s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(22vmax,30vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-26vmax,-22vmax) scale(.92)}}

/* receta de vidrio */
.glass,.pair,.alarm,.lc,.ev,.env,.res,.group,.mb-scene,.chip,.pill,.iconbtn,.input,.note,.seg,.player,.code{
  background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  border:1px solid var(--hi2);box-shadow:inset 0 1px 0 var(--hi),var(--glass-sh)}
.chip,.input,.note,.seg,.iconbtn,.pill{box-shadow:inset 0 1px 0 var(--hi)}
.chip.on{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 14px color-mix(in srgb,var(--fg) 25%,transparent)}
.chip.add{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.alarm.heavy-ready{background:color-mix(in srgb,var(--warn) 18%,var(--glass-bg))}
.btn.soft{background:var(--glass-bg);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid var(--hi2);box-shadow:inset 0 1px 0 var(--hi)}
.btn:not(.soft):not(.ghost):not(.danger){box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 18px color-mix(in srgb,var(--fg) 22%,transparent)}
.seg button.on{background:var(--glass-strong);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.08)}
/* brillo especular que sigue el dedo en las tarjetas */
.lc,.env,.pair,.ev{position:relative;overflow:hidden}
.lc:after,.env:after,.ev:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(220px circle at var(--mx,50%) var(--my,-40%),var(--hi),transparent 60%);opacity:0;transition:opacity .3s}
.lc:hover:after,.env:hover:after,.ev:hover:after,.lc:active:after,.env:active:after{opacity:.6}

/* encabezado fijo de vidrio */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:19;background:var(--glass-strong);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:18;margin-inline:-16px;padding-inline:16px;transition:background .3s,box-shadow .3s}
.top.scrolled{background:var(--glass-strong);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);box-shadow:0 1px 0 var(--hi2)}
#isoTop .iso{transition:transform .5s var(--spring)}
#isoTop.pulse .iso{animation:isoPulse .7s var(--spring)}
@keyframes isoPulse{40%{transform:scale(1.18) rotate(-18deg)}}

/* barra de pestañas: cápsula flotante con una gota de vidrio que se desliza */
.tabbar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;padding:6px;border-radius:30px;border:1px solid var(--hi2);
  background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 1px 0 var(--hi),0 14px 40px rgba(0,0,0,.18)}
.tabbar nav{position:relative;max-width:none}
.tab-blob{position:absolute;top:0;bottom:0;left:0;width:20%;border-radius:24px;background:var(--glass-strong);border:1px solid var(--hi2);box-shadow:inset 0 1px 0 var(--hi),0 4px 14px rgba(0,0,0,.10);transition:transform .55s var(--spring),width .3s;pointer-events:none}
.tab-blob.squish{animation:squish .55s var(--ease)}
@keyframes squish{30%{scale:1.18 .86}65%{scale:.96 1.04}}
.tb{z-index:1}
.tb.on svg{animation:tabPop .45s var(--spring)}
@keyframes tabPop{40%{transform:translateY(-3px) scale(1.12)}}
.app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.toast{bottom:calc(100px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--fg) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.2)}

/* hoja inferior y avisos */
.scrim{background:rgba(5,6,15,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--hi);box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:sheetUp .5s var(--spring)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.scrim.closing{animation:fadeOut .22s forwards}
.scrim.closing .sheet{animation:sheetDown .22s ease-in forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetDown{to{transform:translateY(60%)}}
.push{background:var(--glass-strong);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--hi2);box-shadow:inset 0 1px 0 var(--hi),0 14px 40px rgba(0,0,0,.2)}

/* entradas escalonadas al cambiar de sección */
.view.enter .stg{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0) * 38ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.view{animation:none}

function idbOpen(){

// las fotos de la cámara pueden pesar varios MB; sin achicarlas, mandarlas
// por el canal directo es lento y en algunos teléfonos directamente falla
// (hay un límite de tamaño por mensaje). Las bajamos a un tamaño razonable
// antes de guardarlas y mandarlas — también hace que la app ande más rápido.
function compressImage(file,maxDim=1600,quality=0.82){
  return new Promise(res=>{
    if(!file||!file.type||!file.type.startsWith('image/'))return res(null);
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){const r=Math.min(maxDim/w,maxDim/h);w=Math.round(w*r);h=Math.round(h*r)}
      try{
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg',quality));
      }catch(e){URL.revokeObjectURL(url);res(null)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null)};
    img.src=url;
  });
}
// como antes, pero cae a leer el archivo tal cual si no se pudo comprimir
// (no es una foto, o algo falló)
function readPhoto(file){
  return compressImage(file).then(d=>d||new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)}));
}

      const req=st.openCursor();
      req.onsuccess=e=>{const c=e.target.result;if(c){blobs[c.key]=c.value;c.continue()}else res()};
      req.onerror=()=>res();
    }catch(e){res()}
  })).catch(()=>{});
}

const NET={peer:null,conn:null,ready:false,id:null,onHello:null,onSignal:null,onState:null,retryT:null};

function netSend(msg){try{NET.conn&&NET.conn.open&&NET.conn.send(msg)}catch(e){}}
// para avisos que tienen que llegar sí o sí (cartas, eventos, listas, alarma):
// si al mandarlos no hay conexión en vivo, se guardan y se reintentan solos
// apenas vuelva a conectar (al abrir la app, al reconectar, etc).
// las fotos (base64) no se guardan dentro de la cola: esa cola es parte del
// mismo estado que se reescribe entero en localStorage cada vez que se guarda
// cualquier cosa en la app (marcar una tarea, etc.) — si llevara fotos adentro,
// cada guardado chiquito se volvería lentísimo y hasta podría llenar el
// espacio disponible. La foto ya está a salvo en IndexedDB; al reintentar se
// vuelve a pegar desde ahí.
function stripBlob(msg){
  const m=Object.assign({},msg);
  if(m.letter){m.letter=Object.assign({},m.letter);delete m.letter.blob}
  if(m.photo){m.photo=Object.assign({},m.photo);delete m.photo.blob}
  if(m.item){m.item=Object.assign({},m.item);delete m.item.blob}
  return m;
}
function reattachBlob(msg){
  if(msg.letter&&msg.letter.k&&blobs[msg.letter.k])msg.letter.blob=blobs[msg.letter.k];
  if(msg.photo&&msg.photo.k&&blobs[msg.photo.k])msg.photo.blob=blobs[msg.photo.k];
  if(msg.item&&msg.item.k&&blobs[msg.item.k])msg.item.blob=blobs[msg.item.k];
  return msg;
}
/* cambios que viajan dentro de la notificación push: así llegan aunque los dos
   teléfonos nunca tengan la app abierta al mismo tiempo (el iPhone la cierra enseguida) */
let pendSync=[],pendTO=null;

function takeSync(){const out=[];let n=0;while(pendSync.length){const j=JSON.stringify(pendSync[0]);const b=new TextEncoder().encode(j).length;if(n+b>2600)break;n+=b;out.push(pendSync.shift())}return out}
function netSendSure(msg){
  msg.mid=msg.mid||uid();msg.ts=msg.ts||Date.now();

  if(!NET.ready&&S.partnerPushSub&&!hasBlob(msg)&&new TextEncoder().encode(JSON.stringify(msg)).length<2600){
    pendSync.push(msg);clearTimeout(pendTO);
    pendTO=setTimeout(()=>{while(pendSync.length){const sy=takeSync();if(!sy.length){pendSync.shift();continue}sendPush(S.partnerPushSub,{title:'Twin Particles',body:S.partner+' tiene novedades tuyas',tag:'sync',url:'./',sync:sy,ttl:604800})}},60);
  }
  if(!NET.ready){
    S.outbox=S.outbox||[];
    S.outbox.push(Object.assign({t:Date.now()},stripBlob(msg)));
    // si nunca se reconecta (se desvincularon, desinstaló, etc) esto no
    // puede crecer para siempre: se guarda como mucho 1 mes y 300 avisos
    const cut=Date.now()-30*24*3600*1000;
    S.outbox=S.outbox.filter(m=>!m.t||m.t>cut).slice(-300);
    save();
  }

function flushOutbox(){

function netWire(conn){

  conn.on('data',handleMsg);
  conn.on('close',()=>{NET.ready=false;partnerVis=false;netOnStatus(false);netScheduleReconnect()});
  conn.on('error',()=>{NET.ready=false;netOnStatus(false)});
}
function handleMsg(d){

    if(d.type==='hello'&&NET.onHello)NET.onHello(d);
    else if(d.type==='signal'&&NET.onSignal)NET.onSignal(d);
    else if(d.type==='touch'&&NET.onTouch)NET.onTouch(d);
    else if(d.type==='beat'&&NET.onBeat)NET.onBeat(d);
    else if(d.type==='tap'&&NET.onTap)NET.onTap(d);
    else if(d.type==='beatOn'&&NET.onBeatOn)NET.onBeatOn(d);

    else if(d.type==='albumdel'&&NET.onAlbumDel)NET.onAlbumDel(d);

    else if(d.type==='remind'&&NET.onRemind)NET.onRemind(d);

    else if(d.type==='pushsub'){S.partnerPushSub=d.sub;save()}

async function netHost(code,cb){

  NET.peer=p;NET.id=id;

async function netJoin(code,cb){
  await loadPeerJS();
  if(NET.peer)try{NET.peer.destroy()}catch(e){}
  const p=new Peer({debug:0});
  NET.peer=p;
  p.on('open',myId=>{
    NET.id=myId;
    const conn=p.connect('tp9-'+code,{reliable:true});
    let settled=false;
    conn.on('open',()=>{settled=true;netWire(conn);cb&&cb(null,myId)});
    conn.on('error',e=>{if(!settled){settled=true;cb&&cb(e)}});
    setTimeout(()=>{if(!settled){settled=true;cb&&cb(new Error('timeout'))}},9000);
  });

function netConnectToPartner(){
  if(!S.paired||!S.partnerPeerId||!S.myPeerId)return;
  if(NET.ready)return; // ya hay una conexión de verdad, no hace falta nada
  loadPeerJS().then(()=>{
    if(NET.peer&&!NET.peer.destroyed){
      // el peer existe pero quedó "colgado" (típico al volver de 2do plano:
      // el socket con el broker se corta solo, sin avisar con un evento limpio)
      if(NET.peer.disconnected){try{NET.peer.reconnect();return}catch(e){}}
      else return; // sigue vivo, puede reconectar solo
      try{NET.peer.destroy()}catch(e){}
    }
    const p=new Peer(S.myPeerId,{debug:0});
    NET.peer=p;
    p.on('open',()=>{const c=p.connect(S.partnerPeerId,{reliable:true});netWire(c)});
    p.on('connection',conn=>netWire(conn));
    p.on('disconnected',()=>{try{p.reconnect()}catch(e){netScheduleReconnect()}});
    p.on('close',()=>{if(NET.peer===p)NET.peer=null;netScheduleReconnect()});
    p.on('error',()=>netScheduleReconnect());
  });
}

// WebRTC se puede morir sin avisar con un evento 'close' prolijo; por eso,
// además de reaccionar a 'close'/'error', probamos reconectar cada vez que
// la app vuelve a primer plano, vuelve el internet, o cada tanto si quedó
// "colgada" sin que nadie se diera cuenta.

/* =========================================================
   NOTIFICACIONES EN SEGUNDO PLANO (Web Push, sin servidor propio)

   alcanza para autenticar los avisos ante el navegador, no protege nada valioso.

const VAPID_PUB='BMzKUgL6etueLcdZg9z7grPb8F01ZjYBNPYk2uL978mFxENeNOALZsX8wjlrUPPtejHd1BuU0arYbZK9i_yGWdM';
const RELAY_URL='https://twin-particales-push.francosiderides.workers.dev';
const RELAY_KEY='tp9-f3kd9s82jd';
const b64uToBuf=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
const bufToB64u=b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
async function ensurePush(){
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){S.pushBlocked=1;S.pushReason='unsupported';save();return null}
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){S.pushBlocked=1;S.pushReason='denied';save();return null}
    if(S.pushBlocked){S.pushBlocked=0;S.pushReason=null;save()}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBuf(VAPID_PUB)});
    const j=sub.toJSON();S.myPushSub=j;save();
    if(NET.ready)netSend({type:'pushsub',sub:j});
    return j;
  }catch(e){return null}
}
function drainInbox(){
  try{const rq=indexedDB.open('tp-inbox',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('m',{autoIncrement:true});

  }catch(e){}
}

    <ol class="sub" style="line-height:1.9;padding-left:20px;margin:6px 0 14px"><li>Tocá <b>Compartir</b> <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><path d="M12 3v12M7 8l5-5 5 5M5 12v8h14v-8"/></svg> en la barra de Safari</li><li>Elegí <b>Agregar a inicio</b></li><li>Abrí Twin Particles desde el ícono nuevo</li></ol>

async function sendPush(sub,payloadObj){
  // el navegador ya no puede mandarle el push directo al servicio (FCM/Mozilla/Apple
  // bloquean eso por CORS desde 2022), así que un relay chiquito hace esa parte.
  try{
    if(!sub||!sub.endpoint)return false;
    const r=await fetch(RELAY_URL,{method:'POST',headers:{'Content-Type':'application/json','x-relay-key':RELAY_KEY},body:JSON.stringify({subscription:sub,payload:payloadObj})});
    let j=null;try{j=await r.json()}catch(e){}
    // suscripción vencida del otro lado: se olvida y su teléfono manda una nueva al reconectar
    if(j&&(j.status===404||j.status===410)&&S.partnerPushSub&&S.partnerPushSub.endpoint===sub.endpoint){S.partnerPushSub=null;save();return false}
    return r.ok&&(!j||j.ok!==false);
  }catch(e){return false}
}

let C={};
function readColors(){const cs=getComputedStyle(document.documentElement);['a','b','fg','muted','line'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim()||'#888')}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function hexA(h,a){h=(h||'#888').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

let field=null;
// bond: 0 = partículas separadas e independientes, 1 = entrelazadas en una misma órbita
function makeField(cv,bond0,opt={}){
  if(field)field.stop();
  const ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const st={bond:bond0,anim:null,flare:0,alive:true,shock:0,rip:[0,0],held:-1,pos:[[0,0],[0,0]]};
  const stars=Array.from({length:opt.stars||40},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.3,p:Math.random()*6}));
  const t0=performance.now();let raf;
  function frame(nw){
    if(!st.alive||!document.body.contains(cv))return;
    const W=Math.round(cv.clientWidth*dpr),H=Math.round(cv.clientHeight*dpr);
    if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H}
    const w=cv.width,h=cv.height,t=reduce?2:(nw-t0)/1000;
    if(st.anim){const p=Math.min(1,(nw-st.anim.s)/st.anim.d);st.bond=st.anim.from+(st.anim.to-st.anim.from)*ease(p);if(p>=1){const cb=st.anim.cb;st.anim=null;cb&&cb()}}
    const b=st.bond,f=st.flare;
    ctx.clearRect(0,0,w,h);
    stars.forEach(s=>{ctx.fillStyle=hexA(C.muted,.18+.18*Math.sin(t*.8+s.p));ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r*dpr,0,7);ctx.fill()});
    const cx=w/2,cy=h*.5,R=Math.min(w*.24,h*.32),ang=t*.6+ (1-b)*2.2;
    const oA=[cx+Math.cos(ang)*R,cy+Math.sin(ang)*R*.42],oB=[cx-Math.cos(ang)*R,cy-Math.sin(ang)*R*.42];
    const pA=[w*.2+Math.sin(t*.7)*10*dpr,h*.42+Math.cos(t*.93)*14*dpr],pB=[w*.8+Math.sin(t*1.17+2)*12*dpr,h*.58+Math.cos(t*.61+1)*12*dpr];
    const A=[pA[0]+(oA[0]-pA[0])*b,pA[1]+(oA[1]-pA[1])*b],B=[pB[0]+(oB[0]-pB[0])*b,pB[1]+(oB[1]-pB[1])*b];
    if(b>.01){
      ctx.strokeStyle=hexA(C.muted,.22*b);ctx.lineWidth=dpr;ctx.setLineDash([2*dpr,5*dpr]);
      ctx.beginPath();ctx.ellipse(cx,cy,R,R*.42,0,0,7);ctx.stroke();ctx.setLineDash([]);
      const g=ctx.createLinearGradient(A[0],A[1],B[0],B[1]);g.addColorStop(0,hexA(C.a,(.15+.6*f)*b));g.addColorStop(1,hexA(C.b,(.15+.6*f)*b));
      ctx.strokeStyle=g;ctx.lineWidth=(1+2*f)*dpr;ctx.beginPath();
      ctx.moveTo(A[0],A[1]);ctx.quadraticCurveTo(cx+Math.sin(t*1.3)*8*dpr,cy-12*dpr*Math.cos(t*.9),B[0],B[1]);ctx.stroke();
    }
    if(st.shock>0){const sr=(1-st.shock)*Math.max(w,h)*.7;ctx.strokeStyle=hexA(C.fg,st.shock*.35);ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(cx,cy,sr,0,7);ctx.stroke();st.shock=Math.max(0,st.shock-.012)}
    st.pos=[A,B];
    [[A,C.a,2.1,0],[B,C.b,3.3,1.3]].forEach(([[x,y],c,fr,ph],i)=>{
      // separadas: cada una late a su ritmo; entrelazadas: laten en sincronía
      const solo=Math.sin(t*fr+ph),sync=Math.sin(t*3);
      const pulse=1+.1*(solo*(1-b)+sync*b);
      const gr=(26+40*f)*dpr;
      const rg=ctx.createRadialGradient(x,y,0,x,y,gr);rg.addColorStop(0,hexA(c,.5));rg.addColorStop(1,hexA(c,0));
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,gr,0,7);ctx.fill();
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,(6+3*f)*dpr*pulse,0,7);ctx.fill();
      if(f>.02){ctx.strokeStyle=hexA(c,f*.8);ctx.lineWidth=1.5*dpr;ctx.beginPath();ctx.arc(x,y,(10+(1-f)*60)*dpr,0,7);ctx.stroke()}
      // toque: onda que sale de la partícula tocada
      const r=st.rip[i];if(r>0){[0,.35].forEach(o=>{const q=Math.max(0,r-o);if(q<=0)return;ctx.strokeStyle=hexA(c,q*.9);ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(x,y,(12+(1-q)*80)*dpr,0,7);ctx.stroke()});st.rip[i]=Math.max(0,r-.022)}
      // latido: brillo que late como un corazón mientras se mantiene apretado
      if(st.held===i){const ph2=(nw/1000)%0.9,beat=Math.max(Math.exp(-((ph2-.08)**2)/.002),.7*Math.exp(-((ph2-.3)**2)/.002));const hr=(18+30*beat)*dpr;const hg=ctx.createRadialGradient(x,y,0,x,y,hr);hg.addColorStop(0,hexA(c,.6*beat+.2));hg.addColorStop(1,hexA(c,0));ctx.fillStyle=hg;ctx.beginPath();ctx.arc(x,y,hr,0,7);ctx.fill()}
    });
    st.flare=Math.max(0,f-.012);
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  return field={
    bondTo(to,d,cb){if(reduce){st.bond=to;cb&&cb();return}st.anim={from:st.bond,to,s:performance.now(),d,cb}},
    flare(){st.flare=1},shock(){st.shock=1;st.flare=1},
    ripple(i){st.rip[i]=1},hold(i){st.held=i},
    hit(cx,cy){const r=cv.getBoundingClientRect(),x=(cx-r.left)*dpr,y=(cy-r.top)*dpr;let best=-1,bd=46*dpr;st.pos.forEach(([px,py],i)=>{const d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=i}});return best},
    stop(){st.alive=false;cancelAnimationFrame(raf)}
  };
}

const artCache={};
function genArt(seed){
  if(artCache[seed])return artCache[seed];
  const c=document.createElement('canvas');c.width=c.height=360;const x=c.getContext('2d');
  let s=seed*9301+49297;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const hues=[[18,40],[200,230],[330,20],[260,300],[150,190],[35,10]];const [h1,h2]=hues[seed%hues.length];
  const g=x.createLinearGradient(0,0,0,360);g.addColorStop(0,`hsl(${h1},60%,${60+rnd()*15}%)`);g.addColorStop(1,`hsl(${h2},55%,${35+rnd()*15}%)`);
  x.fillStyle=g;x.fillRect(0,0,360,360);
  x.fillStyle=`hsla(${h1+30},90%,85%,.9)`;x.beginPath();x.arc(80+rnd()*200,90+rnd()*80,22+rnd()*30,0,7);x.fill();
  for(let i=0;i<3;i++){x.fillStyle=`hsla(${h2},40%,${20+i*8}%,${.5+i*.15})`;x.beginPath();x.moveTo(0,360);let y=200+i*45+rnd()*30;x.lineTo(0,y);for(let k=0;k<=6;k++)x.lineTo(k*60,y+(rnd()-.5)*50);x.lineTo(360,360);x.fill()}
  return artCache[seed]=c.toDataURL('image/jpeg',.8);
}

/* toques y latidos: tocar la partícula de tu pareja hace vibrar su teléfono */
let tapN=0,tapTO=null,hintTO=null;
function hint(t,ms){const h=$('#tHintT');if(!h)return;h.textContent=t;$('#tHint').classList.add('live');clearTimeout(hintTO);hintTO=setTimeout(()=>{const h2=$('#tHintT');if(h2){h2.textContent='Tocá a '+S.partner+' para que su teléfono vibre · mantené para un latido';$('#tHint').classList.remove('live')}},ms||2200)}
function sendTap(){
  field&&field.ripple(1);vib(20);tapN++;netSend({type:'tap'});
  hint(tapN>1?tapN+' toques':'Toque enviado · el teléfono de '+S.partner+' vibra');
  clearTimeout(tapTO);tapTO=setTimeout(()=>{
    const n=tapN;tapN=0;S.feed.unshift({from:'m',text:n>1?n+' toques':'Un toque',t:Date.now()});save();renderFeed();
    netSendSure({type:'touch',n});pushPartner('Te tocó','Tocá para sentirlo','touch');
  },1200);
}
function bindTouch(){
  const cv=$('#field');if(!cv||!field)return;
  let holdTO=null,beatIv=null,holdStart=0,holding=false,downIdx=-1;
  const endHold=()=>{clearTimeout(holdTO);clearInterval(beatIv);if(field)field.hold(-1);
    if(holding){holding=false;netSend({type:'beatOff'});const secs=Math.max(1,Math.round((performance.now()-holdStart)/1000));S.feed.unshift({from:'m',text:'Latido de '+secs+' s',t:Date.now()});save();renderFeed();netSendSure({type:'beat',secs});pushPartner('Te mandó un latido','De '+secs+' s','beat');hint('Latido de '+secs+' s enviado a '+S.partner);entangle()}};
  cv.addEventListener('pointerdown',e=>{
    downIdx=field.hit(e.clientX,e.clientY);
    if(downIdx===0){field.ripple(0);vib(8);hint('Esa sos vos. Tocá a '+S.partner);return}
    if(downIdx!==1)return;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    holdTO=setTimeout(()=>{holding=true;holdStart=performance.now();field.hold(1);netSend({type:'beatOn'});
      const beat=()=>{vib([45,110,70]);const s=Math.round((performance.now()-holdStart)/1000);hint('Latido · '+s+' s · '+S.partner+' lo siente',4000)};beat();beatIv=setInterval(beat,900)},420);
  });
  cv.addEventListener('pointerup',()=>{if(downIdx===1&&!holding){clearTimeout(holdTO);sendTap()}else endHold();downIdx=-1});
  cv.addEventListener('pointercancel',()=>{endHold();downIdx=-1});
  cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')cv.style.cursor=field&&field.hit(e.clientX,e.clientY)>=0?'pointer':'default'});
  $('#tHint').onclick=sendTap;
}
function renderSigs(){
  const el=$('#sigs');if(!el)return;
  el.innerHTML=S.signals.map((s,i)=>`<button class="chip" data-i="${i}">${esc(s)}</button>`).join('')+`<button class="chip add" id="addSig">+ Nueva</button>`;
  el.querySelectorAll('[data-i]').forEach(b=>{
    let to,lp=0;
    b.addEventListener('pointerdown',()=>{lp=0;to=setTimeout(()=>{lp=1;vib(15);sheet(`<h2>¿Borrar “${esc(S.signals[b.dataset.i])}”?</h2><div class="row"><button class="btn soft full" id="no">Cancelar</button><button class="btn full" id="si">Borrar</button></div>`,()=>{$('#no').onclick=closeSheet;$('#si').onclick=()=>{S.signals.splice(b.dataset.i,1);save();renderSigs();closeSheet()}})},650)});
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(to)));
    b.addEventListener('click',()=>{if(lp){lp=0;return}send(S.signals[b.dataset.i],b)});
  });
  $('#addSig').onclick=()=>sheet(`<h2>Nueva señal rápida</h2>
    <div class="field"><label for="ns">Texto del botón</label><input class="input" id="ns" maxlength="30" placeholder="Ej: Pasame a buscar"></div>
    <p class="sub">Para borrar una señal, mantenela apretada.</p>
    <button class="btn full" id="nsOk">Agregar</button>`,()=>{
      $('#ns').focus();$('#ns').onkeydown=e=>{if(e.key==='Enter')$('#nsOk').click()};
      $('#nsOk').onclick=()=>{const v=$('#ns').value.trim();if(v){S.signals.push(v);save();renderSigs();closeSheet();toast('Señal agregada')}}});
}
const feedHTML=arr=>arr.length?arr.map(m=>`<div class="msg"><span class="sp" style="background:var(--${m.from==='m'?'a':'b'})"></span><span class="tx"><b>${esc(m.from==='m'?meName():S.partner)}</b> · ${esc(m.text)}</span><span class="t">${hhmm(m.t)}</span></div>`).join(''):'<p class="empty">Todavía no se mandaron señales.</p>';
function renderFeed(){const el=$('#feed');if(!el)return;el.innerHTML=feedHTML(S.feed.slice(0,4));const f=el.firstElementChild;if(f&&S.feed[0]&&Date.now()-S.feed[0].t<1500)f.classList.add('new')}

let alarmState='idle',alarmTO,simTO=null;
const TONES={entrelazado:'Entrelazado',clasico:'Clásico',suave:'Suave',urgente:'Urgente'};
const HEAVY_AT=3;
function holdButton(h,f,ms,done){
  let st,an;
  const stop=()=>{cancelAnimationFrame(an);f.style.transition='transform .25s';f.style.transform='scaleX(0)'};
  const start=()=>{f.style.transition='none';st=performance.now();const step=n=>{const p=Math.min(1,(n-st)/ms);f.style.transform=`scaleX(${p})`;if(p<1)an=requestAnimationFrame(step);else done()};an=requestAnimationFrame(step)};
  h.onpointerdown=e=>{try{h.setPointerCapture(e.pointerId)}catch(_){}start()};
  h.onpointerup=h.onpointercancel=stop;
  h.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!e.repeat){e.preventDefault();start()}};
  h.onkeyup=e=>{if(e.key==='Enter'||e.key===' ')stop()};
}
const ignoredDots=n=>`<div class="ign" aria-label="${n} de ${HEAVY_AT} alarmas ignoradas">${Array.from({length:HEAVY_AT},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}<span>${n?`${n} de ${HEAVY_AT} ignoradas`:'Sin alarmas ignoradas'}</span></div>`;
function renderAlarm(){
  const el=$('#alarm');if(!el)return;
  const n=Math.min(S.ignored||0,HEAVY_AT),heavy=n>=HEAVY_AT;
  el.classList.toggle('heavy-ready',heavy&&alarmState==='idle');
  if(alarmState==='idle'){
    el.innerHTML=(heavy?`<div class="heavy-head"><b>${esc(S.partner)} ignoró ${HEAVY_AT} alarmas</b><p class="sub">Se desbloqueó el modo sueño pesado: volumen máximo desde el primer segundo, sirena, pantalla que destella y vibración continua. No tiene “5 minutos más”.</p></div>
      <button class="hold heavy" id="hHold"><span class="fill" id="hFill"></span><span>Sueño pesado<small>Mantené apretado para enviarla</small></span></button>
      <button class="btn ghost full" id="hold2" style="padding:8px">Probar con una alarma normal</button>`
      :`<p>¿${esc(S.partner)} no se despierta? Hacé sonar la alarma de su teléfono, aunque esté en silencio.</p>
      <button class="hold" id="hold"><span class="fill" id="fill"></span><span>Mantené apretado para despertar</span></button>`)
      +ignoredDots(n)+`
      <div class="alarm-div"></div>
      <div class="field"><span class="flabel">Cuando te despierten a vos, suena</span>
        <div class="chips" id="tones">${Object.entries(TONES).map(([k,v])=>`<button class="chip ${S.prefs.tone===k?'on':''}" data-t="${k}" aria-pressed="${S.prefs.tone===k}">${v}</button>`).join('')}</div></div>
      <div class="row"><button class="btn soft" id="aTest" style="flex:1">Probar alarma</button><button class="btn soft" id="aHeavyT" style="flex:1">Probar pesado</button></div>
`;
    if(heavy){holdButton($('#hHold'),$('#hFill'),1800,()=>fire(true));$('#hold2').onclick=()=>{fire(false)}}
    else holdButton($('#hold'),$('#fill'),1400,()=>fire(false));
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.prefs.tone=b.dataset.t;save();document.querySelectorAll('[data-t]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});AU.preview(b.dataset.t)});
    $('#aTest').onclick=()=>ringIncoming(S.partner,true,false);
    $('#aHeavyT').onclick=()=>ringIncoming(S.partner,true,true);
  }else if(alarmState==='ring'||alarmState==='heavy'){
    const hv=alarmState==='heavy';
    el.innerHTML=`<div class="ringing live ${hv?'hv':''}"><span class="bell">${ICON.bell}</span><div><b>${hv?'Sueño pesado sonando':'Sonando'} en el teléfono de ${esc(S.partner)}</b><div class="sub">${hv?'Volumen máximo · sirena · vibración continua':'Volumen en aumento · vibrando'}</div></div></div>
      <div class="ringbar"><i id="rbar"></i></div>
      <button class="btn soft full" id="stopA">Detener alarma</button>`;
    const dur=hv?7000:8000,st=performance.now();const tick=()=>{const b=$('#rbar');if(!b||alarmState==='idle')return;b.style.width=Math.min(100,(performance.now()-st)/dur*100)+'%';if(performance.now()-st<dur)requestAnimationFrame(tick)};tick();
    $('#stopA').onclick=()=>{clearTimeout(alarmTO);alarmState='idle';renderAlarm();toast('Alarma detenida')};
  }else if(alarmState==='sent'){
    const hv=S.lastAlarm&&S.lastAlarm.heavy;
    el.innerHTML=`<div class="ringing ${hv?'hv':''}"><span class="bell">${ICON.bell}</span><div><b>${hv?'Sueño pesado enviado':'Alarma enviada'} a ${esc(S.partner)}</b><div class="sub">${hhmm(S.lastAlarm.t)}${alarmRepIv?' · le vuelve a sonar cada 6 s hasta que conteste (dejá esta pantalla abierta)':''}</div></div></div>
      <div class="row"><button class="btn soft" id="markIgn" style="flex:1">No se despertó</button><button class="btn" id="resetA" style="flex:1">Se despertó</button></div>`;
    $('#resetA').onclick=()=>{S.ignored=0;save();alarmState='idle';renderAlarm();toast('Contador de alarmas reiniciado')};
    $('#markIgn').onclick=()=>{S.ignored=Math.min(HEAVY_AT,(S.ignored||0)+1);save();alarmState='ignored';renderAlarm();if(S.ignored===HEAVY_AT){vib([40,40,40]);toast('Sueño pesado desbloqueado')}};
  }else if(alarmState==='ignored'){
    el.innerHTML=`<div class="ringing"><span class="bell" style="background:var(--muted)">${ICON.bell}</span><div><b>${esc(S.partner)} no respondió</b><div class="sub">Quedó anotada como ignorada</div></div></div>
      ${ignoredDots(n)}
      ${heavy?`<div class="note"><b>Se desbloqueó Sueño pesado.</b> Ya podés usar la alarma más potente.</div>`:''}
      <button class="btn ${heavy?'':'soft'} full" id="resetA">${heavy?'Ver Sueño pesado':'Volver a intentar'}</button>`;
    $('#resetA').onclick=()=>{alarmState='idle';renderAlarm()};
  }else{
    el.innerHTML=`<div class="ringing"><span class="bell" style="background:var(--ok)">${ICON.bell}</span><div><b>${esc(S.partner)} apagó la alarma</b><div class="sub">${S.lastHeavy?'Con Sueño pesado, después de '+S.lastHeavy+' intentos':'Hace un momento'}</div></div></div>
      <button class="btn soft full" id="resetA">Listo</button>`;
    $('#resetA').onclick=()=>{alarmState='idle';S.lastHeavy=0;save();renderAlarm()};
  }
}
function fire(heavy){
  alarmState='sent';S.lastAlarm={heavy:!!heavy,t:Date.now()};save();entangle();vib(heavy?[120,60,120,60,120]:[60,40,60]);renderAlarm();
  S.feed.unshift({from:'m',text:heavy?'Alarma de sueño pesado':'Alarma para despertar',t:Date.now()});save();renderFeed();
  netSendSure({type:'alarm',heavy:!!heavy,t:Date.now()});pushPartner(heavy?'Necesita que te despiertes YA':'Te está despertando','Tocá para apagarla','alarm');alarmRepeat(heavy);renderAlarm();
  if(!NET.ready)toast(S.partnerPushSub?'Le suena como notificación y se repite hasta que conteste':'Guardado · '+S.partner+' no tiene las notificaciones activadas, no va a sonarle con la app cerrada');
}

/* mientras no conteste, la alarma vuelve a sonar en su teléfono cada 8 s (hasta 2 min):
   una sola notificación suena una vez y es fácil no escucharla dormido */
let alarmRepIv=null;
let repLock=null;
function alarmRepeat(heavy){clearInterval(alarmRepIv);let n=0;
  // pantalla encendida mientras insiste: con el teléfono bloqueado el navegador frena los relojes
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>repLock=l,()=>{})}catch(e){}
  alarmRepIv=setInterval(()=>{
  if(alarmState!=='sent'||++n>30){clearInterval(alarmRepIv);alarmRepIv=null;try{repLock&&repLock.release()}catch(e){}repLock=null;return}
  pushPartner((heavy?'Necesita que te despiertes YA':'Te está despertando')+' ('+(n+1)+')','Tocá para apagarla','alarm');
  if(NET.ready)netSend({type:'alarm',heavy:!!heavy,t:Date.now()});
},6000)}
/* pantalla de alarma entrante */
let ringing=null,wakeLock=null,clockIv=null;
function ringIncoming(from,test,heavy){
  if(ringing)return;
  ringing={from,test,heavy};
  closeSheet();
  AU.alarmStart(heavy?'pesado':S.prefs.tone,heavy);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>wakeLock=l,()=>{})}catch(e){}
  const el=document.createElement('div');el.className='ring'+(heavy?' heavy':'');el.id='ring';el.setAttribute('role','alertdialog');el.setAttribute('aria-label',from+' te está despertando');
  el.innerHTML=`<div class="ring-in">
    <span class="label">${heavy?'Sueño pesado':test?'Prueba de alarma':'Despertador a distancia'}${heavy&&test?' · prueba':''}</span>
    <div class="ring-time" id="rTime">${hhmm(Date.now())}</div>
    <div class="ring-orb"><span></span><span></span>${heavy?'<span></span>':''}${ISO(92)}</div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center"><h1>${heavy?esc(from)+' necesita que te despiertes YA':esc(from)+' te está despertando'}</h1>
    <p class="lead" style="text-align:center">${heavy?'Ignoraste 3 alarmas. Esta no se puede posponer.':'Tono '+esc(TONES[S.prefs.tone])+' · el volumen sube de a poco'}</p></div>
    <div class="ring-actions" id="rAct">
      <button class="hold" id="rStop"><span class="fill" id="rFill"></span><span>${heavy?'Mantené apretado 3 segundos':'Mantené apretado para apagar'}</span></button>
      ${heavy?'':'<button class="btn soft full lg" id="rSnooze">5 minutos más</button>'}
    </div></div>`;
  document.body.appendChild(el);
  clockIv=setInterval(()=>{const t=$('#rTime');if(t)t.textContent=hhmm(Date.now())},5000);
  holdButton($('#rStop'),$('#rFill'),heavy?3000:900,()=>heavy?awakeCheck():stopRing('off'));
  if(!heavy)$('#rSnooze').onclick=()=>stopRing('snooze');
  $('#rStop').focus();
}
// Sueño pesado: después de mantener apretado, hay que resolver una cuenta para demostrar que estás despierto.
function awakeCheck(){
  const a=3+Math.floor(Math.random()*7),b=4+Math.floor(Math.random()*6),ok=a+b;
  const opts=[ok,ok+1,ok-2,ok+3].sort(()=>Math.random()-.5);
  const act=$('#rAct');if(!act)return;
  act.innerHTML=`<div class="awake"><span class="label">Demostrá que ya te despertaste</span><div class="sum">${a} + ${b} = ?</div>
    <div class="opts">${opts.map(o=>`<button class="btn soft lg" data-o="${o}">${o}</button>`).join('')}</div><div class="err" id="aErr"></div></div>`;
  act.querySelectorAll('[data-o]').forEach(btn=>btn.onclick=()=>{
    if(+btn.dataset.o===ok)return stopRing('off');
    vib([200,80,200]);$('#aErr').textContent='Incorrecto. La alarma sigue sonando.';
    setTimeout(()=>{const r=$('#ring');if(r){ringing&&(ringing.heavy=true);const act2=$('#rAct');act2.innerHTML=`<button class="hold" id="rStop"><span class="fill" id="rFill"></span><span>Mantené apretado 3 segundos</span></button>`;holdButton($('#rStop'),$('#rFill'),3000,awakeCheck)}},900);
  });
}
function stopRing(how){
  AU.alarmStop();clearInterval(clockIv);
  try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;
  const el=$('#ring');if(el)el.remove();
  const r=ringing;ringing=null;if(!r)return;
  if(r.test)return toast(how==='snooze'?'Prueba terminada · se repetiría en 5 min':'Prueba terminada');
  if(how==='snooze'){S.feed.unshift({from:'m',text:'5 minutos más',t:Date.now()});save();renderFeed();entangle();netSendSure({type:'alarmResp',how:'snooze'});pushPartner('Pidió 5 minutos más','','alarmResp');toast(NET.ready?S.partner+' sabe que pediste 5 minutos más':'Guardado · no se pudo avisar a '+S.partner)}
  else{S.feed.unshift({from:'m',text:'Ya me desperté',t:Date.now()});save();renderFeed();entangle();netSendSure({type:'alarmResp',how:'off'});pushPartner('Ya se despertó','','alarmResp');toast(NET.ready?'Alarma apagada · '+S.partner+' ya lo sabe':'Alarma apagada · no se pudo avisar a '+S.partner)}
}

V.albumes=function(){

  render(`<section class="section">
    <div class="sechead"><h2>Álbumes compartidos</h2><span class="label">${S.albums.reduce((n,a)=>n+a.photos.length,0)} fotos</span></div>

function parseLink(raw){
  raw=(raw||'').trim();if(!raw)return null;
  let u;try{u=new URL(/^https?:\/\//i.test(raw)?raw:'https://'+raw)}catch(e){return null}
  if(!u.hostname.includes('.'))return null;
  const h=u.hostname.replace(/^(www|m)\./,''),p=u.pathname;let src='web',name='';
  if((/(^|\.)google\.[a-z.]+$/.test(h)&&p.startsWith('/maps'))||/^maps\.(google\.[a-z.]+|app\.goo\.gl)$/.test(h)||(h==='goo.gl'&&p.startsWith('/maps'))){
    src='maps';const m=p.match(/\/place\/([^/]+)/);try{name=m?decodeURIComponent(m[1].replace(/\+/g,' ')):(u.searchParams.get('q')||'')}catch(e){}
  }else if(h==='instagram.com'){src='ig';const seg=p.split('/').filter(Boolean);if(seg[0]&&!['p','reel','reels','stories','explore'].includes(seg[0]))name='@'+seg[0]}
  else if(h==='youtube.com'||h==='youtu.be'||h==='music.youtube.com')src='yt';
  else if(h.endsWith('spotify.com'))src='spotify';
  else if(h.endsWith('netflix.com'))src='netflix';
  else if(h.includes('primevideo'))src='prime';
  else if(h.includes('disneyplus'))src='disney';
  else if(h==='max.com'||h.includes('hbomax'))src='max';
  else if(h.endsWith('imdb.com'))src='imdb';
  else if(h.endsWith('letterboxd.com'))src='letterboxd';
  return {url:u.href,src,name,host:h};
}
const srcLabel=x=>x.src?(SRC[x.src]||x.host||'Link'):'';

function wrapText(x,text,maxW,lh,y,max){const words=String(text).split(' ');let line='',lines=[];words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t});lines.push(line);lines=lines.slice(0,max);return lines}
function genPoster(seed,title,meta){
  const key='p'+seed+title;if(covCache[key])return covCache[key];
  const c=document.createElement('canvas');c.width=300;c.height=450;const x=c.getContext('2d');
  let s=seed*7919+13;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  const h=Math.floor(rnd()*360);
  const g=x.createLinearGradient(0,0,300,450);g.addColorStop(0,`hsl(${h},45%,${18+rnd()*14}%)`);g.addColorStop(1,`hsl(${(h+50)%360},50%,${8+rnd()*10}%)`);
  x.fillStyle=g;x.fillRect(0,0,300,450);
  x.globalCompositeOperation='screen';
  for(let i=0;i<2;i++){const cx=60+rnd()*180,cy=90+rnd()*160,r=50+rnd()*70;const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);rg.addColorStop(0,`hsla(${(h+i*140)%360},80%,65%,.75)`);rg.addColorStop(1,`hsla(${(h+i*140)%360},80%,65%,0)`);x.fillStyle=rg;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(255,255,255,.95)';x.font='600 34px Sora, sans-serif';
  const lines=wrapText(x,title,250,38,0,3);lines.forEach((l,i)=>x.fillText(l,24,400-(lines.length-1-i)*38-26));
  if(meta){x.fillStyle='rgba(255,255,255,.6)';x.font='500 13px "JetBrains Mono", monospace';x.fillText(String(meta).toUpperCase().slice(0,30),24,418)}
  return covCache[key]=c.toDataURL('image/jpeg',.85);
}
function genThumb(seed,title){
  const key='v'+seed+title;if(covCache[key])return covCache[key];
  const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d');
  let s=seed*104729+7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;const h=Math.floor(rnd()*360);
  const g=x.createLinearGradient(0,0,480,270);g.addColorStop(0,`hsl(${h},70%,55%)`);g.addColorStop(1,`hsl(${(h+40)%360},65%,35%)`);x.fillStyle=g;x.fillRect(0,0,480,270);

    // base en inglés (p.ej. "El origen" vs "Inception"), así que no alcanza con
    // "copiar la descripción si coincide el título": directamente va primero
    // lo que ya vino en español, y lo de Cinemeta (en inglés) completa lo que falte.
    const seen=new Set(wl.map(x=>norm(x.t)));
    r=wl.concat(cl.filter(x=>!seen.has(norm(x.t)))).slice(0,8);
    if(lb)r=r.map((x,i)=>i?x:{...x,lb:q.trim()})}
  else if(listId==='series'){const [c,w,t]=await Promise.allSettled([cinemetaSearch('series',q),wikiSearch(q,'tv'),tvmazeSearch(q)]);
    const cl=c.status==='fulfilled'?c.value:[],wl=w.status==='fulfilled'?w.value:[],tl=t.status==='fulfilled'?t.value:[];
    if(c.status==='rejected'&&w.status==='rejected'&&t.status==='rejected')throw new Error('sin conexión');
    wl.forEach(x=>{if(!x.img){const m=tl.find(y=>norm(y.t)===norm(x.t));if(m)x.img=m.img}});
    const seen=new Set(wl.map(x=>norm(x.t)));
    r=wl.concat(cl.filter(x=>!seen.has(norm(x.t)))).concat(tl.filter(x=>!seen.has(norm(x.t))&&!cl.some(y=>norm(y.t)===norm(x.t)))).slice(0,8)}
  else if(listId==='yt')r=await youtubeSearch(q);
  else if(listId==='pod')r=await podcastSearch(q);
  return RS[key]=r;
}

function searchCat(listId,q){
  q=norm(q).trim();if(q.length<2)return[];
  if(listId==='yt')return [];
  const words=q.split(/\s+/);
  return (CAT[listId]||[]).filter(x=>{const h=norm(x.t+' '+(x.alt||'')+' '+x.meta);return words.every(w=>h.includes(w))}).slice(0,6).map(x=>{
    const it={t:x.t,meta:x.meta,desc:x.desc};
    if(listId==='rest')Object.assign(it,{url:mapsURL(x.t+' '+x.meta.split(' · ')[1]),src:'maps',host:'google.com'});
    if(listId==='pod')Object.assign(it,{url:'https://open.spotify.com/search/'+encodeURIComponent(x.t),src:'spotify',host:'open.spotify.com'});
    return it;
  });
}
const SEARCH_PH={rest:'Buscar restaurante o bar',pelis:'Buscar película, director o año',series:'Buscar serie',yt:'Buscar en YouTube',pod:'Buscar podcast'};

function manualForm(L){return `

function bindManual(L,items){

      searchRemote(L.id,link.url).then(r=>{if(my!==atok||!r.length)return;auto=r[0];if(!$('#at').value||$('#at').value===link.name)$('#at').value=auto.t;if(!$('#am').value)$('#am').value=auto.meta||'';if(!$('#ad').value)$('#ad').value=auto.desc||'';$('#adet').innerHTML=`Detectado: <span class="src">${esc(srcLabel(link))}</span> · datos completados`}).catch(()=>{if(my===atok)$('#adet').innerHTML=`Detectado: <span class="src">${esc(srcLabel(link))}</span>`})}};
  $('#af').onchange=e=>{file=e.target.files[0];if(file)$('#afn').textContent=file.name};

    if(file){readPhoto(file).then(data=>{const k=uid();setBlob(k,data);it.k=k;done()})}else done();
  };
}

const b64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};

const GUIDE={cap:.2,x:.44,base:.7,desc:.88};

function mfPaintRec(cv,rec,ch){
  const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);

    if(ch==='-'){gw=Math.min(w*.5,300*u);gh=gw*rec.h/rec.w;gy=GUIDE.base*h-260*u-gh/2}else{gh=(met[0]-met[1])*u;gw=gh*rec.w/rec.h;gy=GUIDE.base*h-met[0]*u}
    if(gw>w*.9){const f=w*.9/gw;gw*=f;gh*=f}
    const o=document.createElement('canvas');o.width=Math.max(1,gw*dpr);o.height=Math.max(1,gh*dpr);const ox=o.getContext('2d');ox.drawImage(im,0,0,o.width,o.height);ox.globalCompositeOperation='source-in';ox.fillStyle=(INKS[S.prefs.ink]||INKS.azul).c;ox.fillRect(0,0,o.width,o.height);

function mfStep(){
