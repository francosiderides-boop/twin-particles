  W.src=null;
  mfFrame(`<div class="fw-top"><button class="linkbtn" id="mfBack">${W.i?'‹ Anterior':'‹ Volver'}</button><span class="label">${W.i+1} de ${cs.length}</span><button class="iconbtn" id="fwClose" aria-label="Cerrar">${ICON.x}</button></div>
    <div class="fw-prog"><i style="width:${done/cs.length*100}%"></i></div>
    <div class="fw-ask"><span class="label">${esc(mfKind(ch))}</span><div class="fw-char">${ch==='´'?'´':esc(ch)}</div></div>
    <div class="seg" id="mfMode"><button data-m="photo" class="${W.mode==='photo'?'on':''}">Foto</button><button data-m="draw" class="${W.mode==='draw'?'on':''}">Dibujar</button></div>
    <div class="fw-pad paper-bg"><canvas id="mfCv"></canvas><span class="fw-status" id="mfStatus"></span></div>
    <div id="mfTools"></div>
    <div class="fw-actions row"><button class="btn soft" id="mfSkip" style="flex:1">${rec?'Dejar como está':'Saltear'}</button><button class="btn" id="mfNext" style="flex:2">${W.i===cs.length-1?'Terminar':'Siguiente'}</button></div>`);
  $('#mfBack').onclick=()=>{if(W.i===0)return mfIntro();W.i--;mfStep()};
  document.querySelectorAll('#mfMode [data-m]').forEach(b=>b.onclick=()=>{W.mode=b.dataset.m;mfStep()});
  const go2=()=>{if(W.i>=cs.length-1)return mfReview();W.i++;mfStep()};
  $('#mfSkip').onclick=go2;
  const cv=$('#mfCv');
  if(W.mode==='photo'){
    mfPaintRec(cv,rec,ch);
    $('#mfStatus').textContent=rec?'':'Todavía no hay foto de esta letra';
    $('#mfTools').innerHTML=`<div class="row"><label class="btn soft filebtn" style="flex:1">Sacar foto<input type="file" id="mfCam" accept="image/*" capture="environment"></label><label class="btn soft filebtn" style="flex:1">Elegir de la galería<input type="file" id="mfGal" accept="image/*"></label></div>
      <div class="field" id="mfSensF" hidden><label for="mfSens">Si se ve cortada, subí la sensibilidad. Si aparecen manchas, bajala.</label><input type="range" id="mfSens" min="0" max="1" step="0.05" value="${W.sens}"></div>`;
    const run=()=>{if(!W.src)return;const r=mfProcessPhoto(W.src,W.sens);if(!r){$('#mfStatus').textContent='No encontramos la letra. Probá con más luz o más cerca.';return}
      if(r.w*r.h>900*900){$('#mfStatus').textContent='Hay demasiada tinta en la foto. Probá encuadrando solo la letra.';return}
      MF.glyphs[ch]={png:mfToPng(r),w:r.w,h:r.h};saveGlyphs();$('#mfStatus').textContent='';mfPaintRec(cv,MF.glyphs[ch],ch);$('#mfSkip').textContent='Dejar como está'};
    const onFile=e=>{const f=e.target.files[0];if(!f)return;$('#mfStatus').textContent='Procesando…';const im=new Image();im.onload=()=>{W.src=im;$('#mfSensF').hidden=false;setTimeout(run,20)};im.onerror=()=>{$('#mfStatus').textContent='No se pudo abrir la foto.'};im.src=URL.createObjectURL(f)};

    $('#mfNext').onclick=()=>{if(!MF.glyphs[ch]){$('#mfStatus').textContent='Sacale una foto o tocá Saltear.';return}go2()};
  }else{
    const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);mfDrawGuides(x,w,h);
    // el trazo se guarda al doble de resolución para que la letra quede más prolija
    const R=2,ink=document.createElement('canvas');ink.width=w*R;ink.height=h*R;const ix=ink.getContext('2d');ix.scale(R,R);
    const LW=Math.max(5,h*.03);

    let drawing=false,any=false,sm=null,prev=null,prevMid=null,cur=null;const strokes=[];
    $('#mfStatus').textContent=rec?'Ya guardaste esta letra. Si dibujás, se reemplaza.':'Dibujala apoyada en la línea de abajo';
    const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};

      const mid=[(prev[0]+sm[0])/2,(prev[1]+sm[1])/2];x.beginPath();x.moveTo(prevMid[0],prevMid[1]);x.quadraticCurveTo(prev[0],prev[1],mid[0],mid[1]);x.stroke();prev=sm;prevMid=mid};

      const out=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];out.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}out.push(p[p.length-1]);return out};
    const paint=c=>{strokes.forEach(st=>{const p=smooth(st);if(p.length<2)return dot(c,p[0]);c.beginPath();c.moveTo(p[0][0],p[0][1]);
      for(let i=1;i<p.length-1;i++){const m=[(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2];c.quadraticCurveTo(p[i][0],p[i][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);c.stroke()})};

  }
}

     <div><span>Estado</span><b>${S.paired?'Vinculados':'Partícula solitaria'}</b></div>
     ${S.paired?`<div><span>Entrelazados desde</span><b>${S.pairedAt?fmtLong(S.pairedAt):'—'}</b></div><div><span>Conexión en vivo</span><span class="sub" id="netStatusTxt">${NET.ready?'Conectada ahora':'No conectada ahora'}</span></div>`:`<div><span>Todavía no te vinculaste con tu pareja</span></div>`}</div>
     ${S.paired&&S.pushBlocked?(S.pushReason==='unsupported'?`<p class="sub" style="color:var(--danger,#d4453a)">Para recibir cartas, alarmas y avisos con la app cerrada en este teléfono hay que instalarla: en iPhone, tocá Compartir y "Agregar a inicio"; en Android, el menú del navegador y "Instalar app".</p>`:`<p class="sub" style="color:var(--danger,#d4453a)">Las notificaciones están bloqueadas en este teléfono: mientras la app esté cerrada no vas a recibir cartas, alarmas ni avisos. <button class="linkbtn" id="pushRetry">Activarlas</button></p>`):''}
     ${S.paired?'<button class="btn danger full" id="unpair">Desvincular teléfonos</button>':'<button class="btn full" id="pairNow">Vincularme con mi pareja</button>'}</div>
   <div class="row"><button class="btn soft full" id="reset">Borrar todo</button><button class="btn full" id="sOk">Listo</button></div>
   <div class="ver">Twin Particles · ${VERSION}</div>`,()=>{
    document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.skin=b.dataset.s;save();applySkin();document.querySelectorAll('[data-s]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});entangle()});
    $('#pv').onchange=e=>{S.prefs.vib=e.target.checked;save();if(S.prefs.vib)vib(60)};
    $('#ps').onchange=e=>{S.prefs.sound=e.target.checked;save();if(S.prefs.sound)AU.chime()};
    $('#ptest').onclick=()=>{closeSheet();setTimeout(()=>push(S.partner,'Te extraño'),300)};
    $('#pushRetry')&&($('#pushRetry').onclick=async()=>{const ok=await ensurePush();closeSheet();toast(ok?'Notificaciones activadas':'Seguís bloqueado/a: activalas desde los permisos del navegador para este sitio')});
    bindColorPicker();$('#pcAuto').onclick=()=>{S.prefs.myColor=null;save();applySkin();document.querySelectorAll('#pcol [data-pc]').forEach(x=>{x.classList.remove('on');x.setAttribute('aria-pressed',false)})};
    $('#pmine').onclick=()=>{closeSheet();setTimeout(mfOpen,230)};
    $('#phand').onclick=()=>pickHand(()=>$('#openSettings').click());
    $('#resendHand')&&($('#resendHand').onclick=()=>{sendMyFont();toast(NET.ready?'Letra reenviada a '+S.partner:'Guardado · se manda sola en cuanto '+S.partner+' se conecte')});
    $('#sOk').onclick=()=>{S.partner=$('#sp').value.trim()||'Mi pareja';save();closeSheet();go(S.tab)};
    $('#reset').onclick=()=>sheet(`<h2>¿Borrar todo lo que cargaste?</h2><p class="sub">Se pierden las señales, listas, tareas, eventos, álbumes y cartas. Se mantienen el vínculo, los nombres y los ajustes. Esto no se puede deshacer.</p><div class="field"><label for="rc">Escribí BORRAR para confirmar</label><input class="input" id="rc" autocomplete="off" autocapitalize="characters"></div><div class="row"><button class="btn soft full" id="no">Cancelar</button><button class="btn danger full" id="si" disabled>Borrar todo</button></div>`,()=>{
      $('#no').onclick=closeSheet;$('#rc').oninput=e=>{$('#si').disabled=e.target.value.trim().toUpperCase()!=='BORRAR'};
      $('#si').onclick=()=>{const keep={skin:S.skin,prefs:S.prefs,partner:S.partner,paired:S.paired,pairedAt:S.pairedAt};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);save();closeSheet();go('inicio');toast('Se borró todo')}});
    $('#unpair')&&($('#unpair').onclick=()=>sheet(`<h2>¿Desvincular de ${esc(S.partner)}?</h2><p class="sub">Los dos teléfonos dejan de estar conectados. Para volver a vincularlos van a necesitar un código nuevo.</p><div class="row"><button class="btn soft full" id="no">Cancelar</button><button class="btn full" id="si">Desvincular</button></div>`,()=>{
      $('#no').onclick=closeSheet;$('#si').onclick=()=>{netSend({type:'unpair'});S.paired=false;S.solo=true;S.pairedAt=null;S.myPeerId=null;S.partnerPeerId=null;if(NET.peer)try{NET.peer.destroy()}catch(e){}save();closeSheet();toast('Desvinculado · seguís como partícula solitaria');go(S.tab)}}));
    $('#pairNow')&&($('#pairNow').onclick=()=>{closeSheet();if(field){field.stop();field=null}showOnboard()});
  });
};

/* hoja inferior */
let lastFocus=null;
function sheet(html,init){lastFocus=document.activeElement;$('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;$('#scrim').onclick=e=>{if(e.target.id==='scrim')closeSheet()};init&&init()}
function closeSheet(){const sc=$('#scrim');if(sc&&!reduce){sc.classList.add('closing');sc.style.pointerEvents='none';sc.removeAttribute('id');setTimeout(()=>{if(sc.isConnected)sc.remove()},220)}else $('#layer').innerHTML='';if(S.tab==='cartas'&&!$('#main').hidden)V.cartas();try{lastFocus&&lastFocus.focus&&document.body.contains(lastFocus)&&lastFocus.focus()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').innerHTML)closeSheet()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* arranque */
applySkin();
mfLoadSaved();
loadSavedPartnerFont();
NET.onSignal=d=>receive(d.text);
let lastTapIn=0,pBeatIv=null,pBeatTO=null,pBeatLive=0;
const feltBack=()=>{if(document.visibilityState==='visible')netSend({type:'felt'})};
NET.onTap=()=>{lastTapIn=Date.now();vib(70);try{field&&field.ripple(1)}catch(e){}if(typeof hint==='function')hint(S.partner+' te está tocando',1800);feltBack()};
NET.onTouch=d=>{S.feed.unshift({from:'p',text:d.n>1?d.n+' toques':'Un toque',t:d.ts||Date.now()});save();entangle();push(S.partner,'te tocó');
  if(!d.late&&Date.now()-lastTapIn>3000){const n=Math.min(d.n||1,8),p=[];for(let i=0;i<n;i++)p.push(70,110);vib(p);feltBack()}renderFeed&&renderFeed()};
function heartStop(){clearInterval(pBeatIv);clearTimeout(pBeatTO);pBeatIv=null;try{field&&field.hold(-1)}catch(e){}}
NET.onBeatOn=()=>{heartStop();pBeatLive=Date.now();try{field&&field.hold(1)}catch(e){}
  const b=()=>{vib([60,120,90]);if(typeof hint==='function')hint('Sentí el latido de '+S.partner,2000)};b();pBeatIv=setInterval(b,900);pBeatTO=setTimeout(heartStop,90000);feltBack()};
NET.onBeatOff=heartStop;
NET.onFelt=()=>{if(typeof hint==='function')hint('A '+S.partner+' le vibró ✓',1600)};
NET.onBeat=d=>{S.feed.unshift({from:'p',text:'Latido de '+d.secs+' s',t:d.ts||Date.now()});save();entangle();push(S.partner,'te mandó un latido de '+d.secs+' s');
  heartStop();if(!d.late&&Date.now()-pBeatLive>(d.secs+5)*1000){const p=[],k=Math.min(d.secs||1,20);for(let i=0;i<k;i++)p.push(60,120,90,630);vib(p);feltBack()}pBeatLive=0;renderFeed&&renderFeed()};
NET.onAlarm=d=>{if(d.t&&Date.now()-d.t>10*60*1000)return;ringIncoming(S.partner,false,!!d.heavy)};
NET.onAlarmResp=d=>{clearInterval(alarmRepIv);alarmRepIv=null;try{repLock&&repLock.release()}catch(e){}repLock=null;
  if(d.how==='off'){S.ignored=0;save();alarmState='idle';toast(S.partner+' se despertó')}
  else{toast(S.partner+' pidió 5 minutos más')}
  if($('#alarm'))renderAlarm();
};
NET.onLetter=d=>{
  const l=d.letter;if(!l||!l.id)return;
  if(S.letters.some(x=>x.id===l.id))return;
  if(l.blob){setBlob(l.k,l.blob)}
  const {blob,...clean}=l;clean.from='p';clean.opened=0;
  S.letters.unshift(clean);save();entangle();updateBadge();push(S.partner,'te mandó una carta');
  if(S.tab==='cartas'&&!$('#main').hidden)V.cartas();
};
const flipW=w=>w==='m'?'p':w==='p'?'m':w;
NET.onListAdd=d=>{
  const items=S.lists[d.listId];if(!items||!d.item)return;
  if(items.some(x=>x.id&&x.id===d.item.id))return;
  const it=Object.assign({},d.item);if(it.blob){setBlob(it.k,it.blob);delete it.blob}
  it.by='p';if(it.who)it.who=flipW(it.who);if(it.doneBy)it.doneBy=flipW(it.doneBy);items.unshift(it);save();entangle();push(S.partner,'agregó algo a una lista');
  if(S.tab==='listas'&&!$('#main').hidden)V.listas();
};
NET.onEventAdd=d=>{
  const ev=Object.assign({},d.ev);if(!ev||!ev.id)return;ev.who=flipW(ev.who);
  const old=S.events.find(x=>x.id===ev.id);
  if(old){Object.assign(old,ev);save();if(S.tab==='calendario'&&!$('#main').hidden)V.calendario();return}
  S.events.push(ev);save();entangle();push(S.partner,'agregó un evento: '+ev.t);
  if(S.tab==='calendario'&&!$('#main').hidden)V.calendario();
};
NET.onAlbumAdd=d=>{
  const al=d.album;if(!al||!al.id)return;
  if(S.albums.some(x=>x.id===al.id))return;
  S.albums.unshift({id:al.id,name:al.name,date:al.date,photos:[]});save();
  if(S.tab==='albumes'&&!$('#main').hidden)V.albumes();
};
NET.onPhotoAdd=d=>{
  let a=S.albums.find(x=>x.id===d.albumId);
  if(!a){a={id:d.albumId,name:d.albumName||'Álbum',date:d.albumDate||TODAYS,photos:[]};S.albums.unshift(a)}
  if(!d.photo||!d.photo.k||a.photos.some(p=>p.k===d.photo.k))return;
  setBlob(d.photo.k,d.photo.blob);a.photos.unshift({k:d.photo.k});save();entangle();
  push(S.partner,'agregó una foto a '+a.name);
  if(openAlbum===a.id)albumView(a);else if(S.tab==='albumes'&&!$('#main').hidden)V.albumes();
};
NET.onAlbumDel=d=>{
  if(!d.id)return;
  S.albums=S.albums.filter(x=>x.id!==d.id);save();
  if(openAlbum===d.id)openAlbum=null;
  if(S.tab==='albumes'&&!$('#main').hidden)V.albumes();
};
NET.onListDone=d=>{
  const items=S.lists[d.listId];if(!items)return;
  const x=items.find(i=>i.id===d.id);if(!x)return;
  x.done=d.done;if('doneBy'in d)x.doneBy=flipW(d.doneBy);save();
  if(S.tab==='listas'&&!$('#main').hidden)V.listas();
};
NET.onListDel=d=>{
  const items=S.lists[d.listId];if(!items)return;
  const i=items.findIndex(x=>x.id===d.id);if(i<0)return;
  items.splice(i,1);save();
  if(S.tab==='listas'&&!$('#main').hidden)V.listas();
};
NET.onListEdit=d=>{
  const items=S.lists[d.listId];if(!items)return;
  const x=items.find(i=>i.id===d.id);if(!x)return;
  const pt=Object.assign({},d.patch);if(pt.who)pt.who=flipW(pt.who);Object.assign(x,pt);save();
  if(S.tab==='listas'&&!$('#main').hidden)V.listas();
};
NET.onEventDel=d=>{
  if(!d.id)return;
  S.events=S.events.filter(e=>e.id!==d.id);save();
  if(S.tab==='calendario'&&!$('#main').hidden)V.calendario();
};
NET.onFontSet=d=>{
  if(!d.buf)return;
  try{localStorage.setItem('tp-partner-font',d.buf)}catch(e){}
  installPartnerFont(unb64(d.buf)).then(()=>{if(S.tab==='cartas'&&!$('#main').hidden)V.cartas()}).catch(()=>{});
};
NET.onRemind=d=>{
  S.feed.unshift({from:'p',text:'Recordatorio: '+d.text,t:Date.now()});save();entangle();
  push(S.partner,'te mandó un recordatorio: '+d.text);renderFeed&&renderFeed();
};
NET.onUnpair=()=>{
  S.paired=false;S.solo=true;S.pairedAt=null;S.partnerPeerId=null;
  if(NET.peer)try{NET.peer.destroy()}catch(e){}
  save();toast(S.partner+' te desvinculó');go('inicio');
};
if(S.paired||S.solo){
  const h=location.hash.slice(1);if(['inicio','albumes','listas','calendario','cartas'].includes(h))S.tab=h;
  enterApp();
  if(S.paired&&S.myPeerId&&S.partnerPeerId)netConnectToPartner();
  if(S.paired){setTimeout(setupCheck,1200);drainInbox()}
  loadBlobsFromIDB().then(()=>{if(V[S.tab]&&!$('#main').hidden)V[S.tab]()});
  // si abrió la app tocando la notificación de una alarma, que suene YA en vez
  // de esperar a que la conexión en vivo confirme el aviso (eso igual llega
  // después y no pasa nada si ya está sonando)
  if(location.hash==='#ring'){history.replaceState(null,'',location.pathname);ringIncoming(S.partner,false,false)}
}else showOnboard();
})();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
